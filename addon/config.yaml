name: "UniFi Port Manager"
description: >
  REST API for disabling and re-enabling ports on UniFi switches while
  preserving full port configuration (VLAN, PoE, STP, port security).
  Pairs with the homeassistant/packages/unifi_ports.yaml config package.
version: "1.1.0"
slug: "unifi_port_manager"
init: false

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

startup: services
boot: auto

ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: "UniFi Port Manager HTTP API"

# Options shown in the HA add-on Configuration tab
options:
  controllerUrl: "https://192.168.1.1"
  site: "default"
  username: "svc_automation"
  password: ""
  deviceName: "SJ-UP-SW-01"
  ucgFiberName: "SJ-FW-01"
  apiPort: 8765
  apiToken: ""

schema:
  controllerUrl: str
  site: str
  username: str
  password: str
  deviceName: str
  ucgFiberName: str?
  apiPort: int
  apiToken: str

homeassistant: "2024.1"
