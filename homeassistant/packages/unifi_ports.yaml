# UniFi switch port control — Home Assistant package
#
# Prerequisites:
#   1. port-api.js is running on the host that has access to the controller.
#   2. unifi_api_token is set in your secrets.yaml  (see secrets.yaml.example).
#   3. This file is included via packages in configuration.yaml (see README).
#
# What this creates:
#   sensor.unifi_switch_ports     — bulk poll, all port data as attributes
#   sensor.unifi_port_N_link      — link state per port (up / down / unknown)
#   switch.unifi_port_N           — toggle switch per port (on = enabled, off = disabled)
#
# Ports 1-8 are 10G copper; ports 9-10 are SFP28 uplinks on the USW Pro XG 8 PoE.
# Remove or comment out ports you don't need to control.
#
# After adding this package, go to Developer Tools → Template to preview
# state_attr('sensor.unifi_switch_ports', 'ports') and confirm port data arrives.

# ── REST command: single endpoint drives enable and disable via data variables ─
rest_command:
  unifi_port_action:
    url: "http://localhost:8765/ports/{{ port_number }}/{{ action }}"
    method: POST
    headers:
      X-API-Token: !secret unifi_api_token
    content_type: "application/json"

# ── REST sensor: bulk poll — all ports in one request ─────────────────────────
rest:
  - resource: "http://localhost:8765/ports"
    scan_interval: 60
    headers:
      X-API-Token: !secret unifi_api_token
    sensor:
      - name: "UniFi Switch Ports"
        unique_id: unifi_switch_ports_bulk
        value_template: "{{ value_json.device | default('unavailable') }}"
        json_attributes:
          - ports
          - device
          - model
          - ip
          - timestamp

# ── Template entities: one sensor + one switch per port ───────────────────────
template:
  - sensor:
      - name: "UniFi Port 1 Link"
        unique_id: unifi_port_1_link
        availability: "{{ not is_state('sensor.unifi_switch_ports', 'unavailable') }}"
        state: >
          {% set p = state_attr('sensor.unifi_switch_ports', 'ports') | default([]) | selectattr('port', 'equalto', 1) | list %}
          {{ p[0].link if p | length > 0 else 'unknown' }}
        icon: "mdi:ethernet"

