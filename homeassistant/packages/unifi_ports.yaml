# UniFi switch port control — Home Assistant package
#
# Verified device inventory (from live controller):
#
#   SJ-UP-SW-01  (USWED76, type usw)  — 10 ports
#     Ports 1-8 : 10GE copper
#     Ports 9-10: SFP+ uplinks
#
#   SJ-FW-01     (UDMA6A8, type udm)  — 7 ports
#     Ports 1-4 : 2.5GE
#     Port  5   : 10GE  (LAN — active)
#     Port  6   : SFP+  (uplink "To SJ-SW-01" — CRITICAL, do not disable)
#     Port  7   : SFP+
#
# Prerequisites:
#   1. port-api.js is running on the host that has access to the controller.
#   2. unifi_api_token is set in secrets.yaml (see secrets.yaml.example).
#   3. ucgFiberName is set in port-config.json (e.g. "SJ-FW-01").
#   4. This file is in your HA packages/ directory.
#
# Entities created:
#   sensor.unifi_switch_ports         — bulk poll, switch port data
#   sensor.unifi_ucg_ports            — bulk poll, UCG Fiber port data
#   sensor.unifi_port_N_link          — link state per switch port
#   sensor.unifi_fw_port_N_link       — link state per UCG Fiber port
#   switch.unifi_port_N               — toggle per switch port
#   switch.unifi_fw_port_N            — toggle per UCG Fiber port

# ── REST command — shared by all devices via ?device= query param ──────────────
rest_command:
  unifi_port_action:
    url: "http://localhost:8765/ports/{{ port_number }}/{{ action }}?device={{ device_name }}"
    method: POST
    headers:
      X-API-Token: !secret unifi_api_token
    content_type: "application/json"

# ── REST sensors — one per device ─────────────────────────────────────────────
rest:
  - resource: "http://localhost:8765/ports"
    scan_interval: 60
    headers:
      X-API-Token: !secret unifi_api_token
    sensor:
      - name: "UniFi Switch Ports"
        unique_id: unifi_switch_ports_bulk
        value_template: "{{ value_json.device | default('unavailable') }}"
        json_attributes:
          - ports
          - device
          - model
          - ip
          - timestamp

  - resource: "http://localhost:8765/ports?device=SJ-FW-01"
    scan_interval: 60
    headers:
      X-API-Token: !secret unifi_api_token
    sensor:
      - name: "UniFi UCG Ports"
        unique_id: unifi_ucg_ports_bulk
        value_template: "{{ value_json.device | default('unavailable') }}"
        json_attributes:
          - ports
          - device
          - model
          - ip
          - timestamp

# ── Template entities ─────────────────────────────────────────────────────────
template:

  # ── Switch (SJ-UP-SW-01) link sensors ───────────────────────────────────────
